spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/devsync
    username: devsync
    password: devsync
    driver-class-name: org.postgresql.Driver

  # Updated: Modern Spring Boot 3.x structure (spring.data.redis is deprecated/moved)
  redis:
    host: localhost
    port: 6379

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC